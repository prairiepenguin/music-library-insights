<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Music Library Insights</title>
  <style>
    :root{--ink:#17211b;--muted:#68736c;--paper:#f3f0e8;--card:#fffdf8;--green:#245f47;--lime:#b8d26e;--line:#d9d6cc;--orange:#dc7b32}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,sans-serif}header{background:var(--ink);color:#fff;padding:28px max(24px,calc((100% - 1180px)/2)) 24px}h1{margin:0;font:700 30px Georgia,serif}header p{color:#cdd5cf;margin:5px 0 0}.wrap{max-width:1180px;margin:auto;padding:24px}nav{display:flex;gap:8px;margin-bottom:22px}.tab,button{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:99px;cursor:pointer}.tab.active,button.primary{color:white;background:var(--green);border-color:var(--green)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.metric{font:700 30px Georgia,serif}.label,.muted{color:var(--muted)}.panel{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}.panel h2{margin:0 0 14px;font:700 21px Georgia,serif}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;min-width:250px;background:white}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{font-size:12px;text-transform:uppercase;color:var(--muted)}tr.clickable{cursor:pointer}tr.clickable:hover{background:#f2f5ec}.badge{display:inline-block;padding:3px 7px;border-radius:10px;background:#e4ead5;font-size:12px}.missing{color:#9e451c}.owned{color:var(--green)}.chart{height:220px;display:flex;align-items:end;gap:12px;padding-top:20px}.bar{background:var(--green);min-width:46px;flex:1;border-radius:6px 6px 0 0;position:relative}.bar span{position:absolute;top:-22px;width:100%;text-align:center;font-size:12px}.bar small{position:absolute;bottom:-35px;width:100%;text-align:center;color:var(--muted)}#status{position:fixed;right:18px;bottom:18px;padding:10px 14px;background:var(--ink);color:white;border-radius:8px;display:none}.back{color:var(--green);cursor:pointer}.empty{padding:32px;text-align:center;color:var(--muted)}@media(max-width:750px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}th:nth-child(4),td:nth-child(4){display:none}}
  </style>
</head>
<body><header><h1>Music Library Insights</h1><p>Know what you own. See what is missing. Watch the collection grow.</p></header>
<main class="wrap"><nav><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="artists">Artists & gaps</button><button class="tab" data-tab="growth">Growth</button><button id="update" class="local-only">Update everything</button></nav><div id="content">Loading…</div></main><div id="status"></div>
<script>
let data, tab='overview', hosted=false; const el=document.querySelector('#content');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const size=n=>n>=1073741824?(n/1073741824).toFixed(1)+' GB':(n/1048576).toFixed(0)+' MB';
const date=s=>s?new Date(s).toLocaleDateString():'—';
function notice(s){let n=document.querySelector('#status');n.textContent=s;n.style.display='block';setTimeout(()=>n.style.display='none',3500)}
async function load(){try{let r=await fetch('/api/dashboard');if(!r.ok)throw 0;data=await r.json()}catch(e){hosted=true;data=await fetch('data.json').then(r=>r.json());document.querySelectorAll('.local-only').forEach(x=>x.remove())}render()}
function render(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab)); if(!data.latest){el.innerHTML='<div class="empty">No catalog yet. Choose Scan now.</div>';return} tab==='overview'?overview():tab==='artists'?artists():growth()}
function overview(){let x=data.latest;el.innerHTML=`<div class="cards"><div class="card"><div class="metric">${x.artists}</div><div class="label">Artists</div></div><div class="card"><div class="metric">${x.albums}</div><div class="label">Albums</div></div><div class="card"><div class="metric">${x.tracks.toLocaleString()}</div><div class="label">Tracks</div></div><div class="card"><div class="metric">${size(x.bytes)}</div><div class="label">Audio</div></div></div><section class="panel"><h2>Library shape</h2><div class="toolbar">${data.formats.map(f=>`<span class="badge">${esc(f.extension.toUpperCase())}: ${f.tracks} tracks</span>`).join('')}<span class="muted">Last scanned ${date(x.scanned_at)}</span></div></section><section class="panel"><h2>Recently modified files</h2><table><thead><tr><th>Artist</th><th>Album</th><th>Track</th><th>Modified</th></tr></thead><tbody>${data.recent.map(r=>`<tr><td>${esc(r.artist)}</td><td>${esc(r.album)}</td><td>${esc(r.title)}</td><td>${date(r.modified_at)}</td></tr>`).join('')}</tbody></table></section>`}
function artists(){el.innerHTML=`<section class="panel"><div class="toolbar"><h2 style="margin-right:auto">Artists & discography gaps</h2><input id="search" placeholder="Filter artists or albums"></div><p class="muted">Open an artist, then check MusicBrainz to compare studio albums. Matches are cached locally.</p><table><thead><tr><th>Artist</th><th>Albums owned</th><th>Tracks</th><th>Catalog status</th></tr></thead><tbody id="artistrows">${artistRows(data.artists)}</tbody></table></section>`;document.querySelector('#search').oninput=e=>document.querySelector('#artistrows').innerHTML=artistRows(data.artists.filter(a=>a.name.toLowerCase().includes(e.target.value.toLowerCase())));bindRows()}
function artistRows(xs){return xs.map(a=>`<tr class="clickable" data-artist="${esc(a.name)}"><td>${esc(a.name)}</td><td>${a.album_count}</td><td>${a.track_count}</td><td>${a.status==='matched'?`<span class="badge">${a.known_releases} releases found</span>`:'Not checked'}</td></tr>`).join('')}
function bindRows(){document.querySelectorAll('[data-artist]').forEach(r=>r.onclick=()=>showArtist(r.dataset.artist))}
async function showArtist(name){let x=hosted?data.artist_details[name]:await fetch('/api/artist?name='+encodeURIComponent(name)).then(r=>r.json()), missing=x.discography.filter(r=>!r.owned);el.innerHTML=`<div class="back" id="back">← All artists</div><div class="cards" style="margin-top:14px"><div class="card"><div class="metric">${x.artist.album_count}</div><div class="label">Albums owned</div></div><div class="card"><div class="metric">${x.artist.track_count}</div><div class="label">Tracks</div></div><div class="card"><div class="metric">${x.discography.length||'—'}</div><div class="label">Known releases</div></div><div class="card"><div class="metric missing">${x.discography.length?missing.length:'—'}</div><div class="label">Missing albums</div></div></div><section class="panel"><div class="toolbar"><h2 style="margin-right:auto">${esc(name)}</h2>${hosted?'':`<button class="primary" id="sync">${x.match?'Refresh':'Check'} MusicBrainz</button>`}</div>${x.match?`<p class="muted">Matched to ${esc(x.match.matched_name)} (${esc(x.match.country||'country unknown')}); confidence ${x.match.score}%.</p>`:'<p class="muted">Discography has not been checked yet.</p>'}<table><thead><tr><th>Your albums</th><th>Tracks</th><th>Size</th></tr></thead><tbody>${x.albums.map(a=>`<tr><td>${esc(a.title)}</td><td>${a.track_count}</td><td>${size(a.bytes)}</td></tr>`).join('')}</tbody></table></section>${x.discography.length?`<section class="panel"><h2>Discography comparison</h2><p class="muted">MusicBrainz album release groups; compilations and live releases are excluded. Your folders are the source of truth for ownership.</p><table><thead><tr><th>Status</th><th>Album</th><th>First released</th></tr></thead><tbody>${x.discography.map(r=>`<tr><td class="${r.owned?'owned':'missing'}">${r.owned?'Owned':'Missing'}</td><td>${esc(r.title)}</td><td>${esc(r.first_release_date||'—')}</td></tr>`).join('')}</tbody></table></section>`:''}`;document.querySelector('#back').onclick=()=>{tab='artists';render()};if(!hosted)document.querySelector('#sync').onclick=()=>sync(name)}
async function sync(name){notice('Checking MusicBrainz…');let r=await fetch('/api/sync?name='+encodeURIComponent(name),{method:'POST'}).then(r=>r.json());if(r.error){notice(r.error);return}notice(`Found ${r.releases} releases`);await load();showArtist(name)}
function growth(){let points=data.growth,max=Math.max(...points.map(s=>s.tracks));el.innerHTML=`<div class="cards"><div class="card"><div class="metric">${points.length}</div><div class="label">Growth rounds</div></div><div class="card"><div class="metric">${points.at(-1)?.tracks||0}</div><div class="label">Tracks accumulated</div></div><div class="card"><div class="metric">${points.at(-1)?.albums||0}</div><div class="label">Albums accumulated</div></div><div class="card"><div class="metric">${size(points.at(-1)?.bytes||0)}</div><div class="label">Audio accumulated</div></div></div><section class="panel"><h2>Library growth by file date</h2><div class="chart">${points.map(s=>`<div class="bar" style="height:${Math.max(8,s.tracks/max*180)}px"><span>${s.tracks}</span><small>${date(s.added_on+'T00:00:00Z')}</small></div>`).join('')}</div></section><section class="panel"><h2>Growth rounds</h2><table><thead><tr><th>Date</th><th>Tracks added</th><th>Total tracks</th><th>Total albums</th><th>Total artists</th></tr></thead><tbody>${points.map(s=>`<tr><td>${date(s.added_on+'T00:00:00Z')}</td><td>+${s.tracks_added}</td><td>${s.tracks}</td><td>${s.albums}</td><td>${s.artists}</td></tr>`).join('')}</tbody></table></section><section class="panel"><h2>Date source</h2><p>The backup volume does not expose original NTFS creation timestamps to Linux. This timeline uses each audio file's retained modification date, which forms distinct import rounds. Future scans remain recorded separately for auditability.</p></section>`}
async function updateAll(){if(!confirm('Rescan the library, check every artist, rebuild the hosted catalog, and push it to GitHub?'))return;await fetch('/api/update-all',{method:'POST'});let button=document.querySelector('#update');button.disabled=true;let timer=setInterval(async()=>{let s=await fetch('/api/update-status').then(r=>r.json());button.textContent=s.running?`${s.message} (${s.current}/${s.total})`:'Update everything';if(!s.running){clearInterval(timer);button.disabled=false;notice(s.error||s.message);await load()}},1000)}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;render()});document.querySelector('#update').onclick=updateAll;load();
</script></body></html>
